name: recipy
description: "A personal recipe manager with local storage and sharing."
publish_to: 'none'

version: 0.2.3+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Image picking + local copy
  image_picker: ^1.1.2

  # Export / import / sharing
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  receive_sharing_intent: ^1.8.0

  # PDF generation and printing
  pdf: ^3.11.1
  printing: ^5.14.2

  # HTTP & URL import
  http: ^1.4.0
  html: ^0.15.6

  # Image compression
  flutter_image_compress: ^2.3.0

  # ZIP archive for .recipy export/import with images
  archive: ^4.0.9

  # Persistent user preferences
  shared_preferences: ^2.3.5

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#f4f6ee"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#f4f6ee"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  android_12:
    color: "#f4f6ee"
    image: assets/images/splash_logo.png
